name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filrouge
          POSTGRES_PASSWORD: filrouge
          POSTGRES_DB: filrouge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://filrouge:filrouge@localhost:5432/filrouge_test

      - name: Run migrations
        working-directory: api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://filrouge:filrouge@localhost:5432/filrouge_test

      - name: Run tests
        working-directory: api
        run: npm test
        env:
          DATABASE_URL: postgresql://filrouge:filrouge@localhost:5432/filrouge_test
          JWT_SECRET: test_secret
          NODE_ENV: test
