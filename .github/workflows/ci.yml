name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1 : Tests unitaires API ───────────────────────────────────────────
  unit-tests:
    name: Tests unitaires API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filrouge
          POSTGRES_PASSWORD: filrouge
          POSTGRES_DB: filrouge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://filrouge:filrouge@localhost:5432/filrouge_test

      - name: Run migrations
        working-directory: api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://filrouge:filrouge@localhost:5432/filrouge_test

      - name: Run unit tests
        working-directory: api
        run: npm test
        env:
          DATABASE_URL: postgresql://filrouge:filrouge@localhost:5432/filrouge_test
          JWT_SECRET: test_secret
          NODE_ENV: test

  # ─── Job 2 : Build Docker ──────────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

  # ─── Job 3 : Tests e2e Playwright ─────────────────────────────────────────
  e2e:
    name: Tests e2e (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests, build]

    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d

      - name: Wait for API
        run: |
          timeout 90 bash -c \
            'until curl -sf http://localhost:3000/health; do sleep 3; done'

      - name: Wait for Web
        run: |
          timeout 90 bash -c \
            'until curl -sf http://localhost:5174; do sleep 3; done'

      - name: Run migrations & seed
        run: |
          docker exec $(docker compose ps -q api) npx prisma migrate deploy
          docker exec $(docker compose ps -q api) node prisma/seed.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: web
        run: npx playwright test
        env:
          BASE_URL: http://localhost:5174

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down
