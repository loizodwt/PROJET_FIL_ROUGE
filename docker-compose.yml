name: filrouge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filrouge
      POSTGRES_PASSWORD: filrouge
      POSTGRES_DB: filrouge
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U filrouge']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://filrouge:filrouge@postgres:5432/filrouge
      JWT_SECRET: supersecretjwt
      PORT: 3000
      NODE_ENV: development
    ports:
      - '3000:3000'
    volumes:
      - ./api:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    command: npm run dev

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:3000
    ports:
      - '5174:5173'
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads_data:
